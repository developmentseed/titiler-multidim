[project]
name = "titiler-multidim"
description = "TiTiler application extension for titiler.xarray."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Vincent Sarago", email = "vincent@developmentseed.com"},
]
license = {text = "MIT"}
keywords = [
    "TiTiler",
    "zarr",
    "xarray",
    "Fastapi",
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]
dependencies = [
    "titiler-core>=0.25.0,<0.26",
    "titiler-xarray>=0.25.0,<0.26",
    "aiobotocore>=2.24.0",
    "aiohttp",
    "boto3>=1.39.0",
    "cftime",
    "fastapi",
    "fsspec",
    "h5netcdf",
    "h5py>=3.16.0",
    "icechunk>=2.0.4",
    "numpy",
    "obstore>=0.9.4",
    "pydantic-settings~=2.14",
    "pydantic>=2.13.3,<3.0",
    "redis",
    "requests",
    "rioxarray",
    "s3fs",
    "xarray>=2025.10.1",
    "zarr>=3.2.0",
]

[project.optional-dependencies]
server = [
    "uvicorn"
]
lambda = [
    "mangum==0.19.0",
    "aiobotocore>=2.24.0,<2.24.2",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "opentelemetry-propagator-aws-xray>=1.0.2",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-sdk-extension-aws>=2.1.0",
]

[dependency-groups]
dev = [
    "dask>=2026.3.0",
    "fakeredis>=2.35.1",
    "httpx2",
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "netcdf4>=1.7.4",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.3",
    "pytest-xdist",
    "ruff>=0.15.12",
    "uvicorn>=0.46.0",
    "virtualizarr",
]
deployment = [
    "aws-cdk-lib==2.253.1",
    "constructs>=10.5.0,<11.0.0",
    "pydantic-settings~=2.14",
    "python-dotenv>=1.2.2",
]
notebooks = [
    "folium",
    "httpx2",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/developmentseed/titiler-multidim"
Issues = "https://github.com/developmentseed/titiler-multidim/issues"
Source = "https://github.com/developmentseed/titiler-multidim"

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
known_first_party = ["titiler"]
default_section = "THIRDPARTY"

[tool.ruff]

[tool.ruff.lint]
select = [
    "D1",  # pydocstyle errors
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B905",  # ignore zip() without an explicit strict= parameter, only support with python >3.10
]

[tool.ruff.lint.per-file-ignores]
"tests/test_app.py" = ["D1"]
"tests/fixtures/generate_test_zarr.py" = ["D1"]
"tests/fixtures/generate_test_reference.py" = ["D1"]

[tool.mypy]
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "file"
path = "src/titiler/multidim/__init__.py"


[tool.pdm]
package-dir = "src/"

[tool.pdm.build]
includes = ["src/titiler/multidim/"]
excludes = ["tests/", "**/.mypy_cache", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=titiler.multidim --cov-report term-missing -s -vv"
pythonpath = ["src", "tests"]
norecursedirs = ["infrastructure"]
