version: 2
updates:
  - package-ecosystem: uv
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps):"
