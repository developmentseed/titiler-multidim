version: 2
updates:
  - package-ecosystem: uv
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: npm
    directory: "/infrastructure/aws"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
    commit-message:
      prefix: "ci(deps):"

  - package-ecosystem: pre-commit
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: monthly
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"
