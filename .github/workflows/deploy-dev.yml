name: CDK Deploy Dev Workflow

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
  pull_request:
    types: [labeled, synchronize]

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    if: >
      github.event_name != 'pull_request' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    env:
      UV_PYTHON: 3.12
      STAGE: ${{ vars.STAGE }}
      TITILER_MULTIDIM_PYTHONWARNINGS: ignore
      TITILER_MULTIDIM_DEBUG: true
      TITILER_MULTIDIM_READER_ROLE_ARN: ${{ vars.TITILER_MULTIDIM_READER_ROLE_ARN }}
      TITILER_MULTIDIM_AUTHORIZED_CHUNK_ACCESS: '{"s3://nasa-waterinsight/NLDAS3/forcing/daily/": {"anonymous": true}, "s3://podaac-ops-cumulus-protected/MUR-JPL-L4-GLOB-v4.1/": {"from_env": true}, "s3://nasa-waterinsight/RASI/": {"anonymous": true}, "s3://noaa-nws-naqfc-pds/": {"anonymous": true}}'

    steps:
      - name: Determine branch to deploy
        id: set_branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_BRANCH: ${{ github.event.inputs.branch }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "branch=$INPUTS_BRANCH" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "branch=$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.set_branch.outputs.branch }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: test-deploy
          aws-region: us-west-2

      - name: Run titiler-multidim deployment
        uses: ./.github/actions/cdk-deploy
        with:
          dir: "./infrastructure/aws"
          env_aws_secret_name: ""

      - name: Smoke-test deployed Icechunk tiles
        run: |
          API_URL="$(jq -er 'to_entries[] | select(.value.Endpoint) | .value.Endpoint' "$HOME/cdk-outputs.json")"
          uv run python scripts/test_deployment.py --api-url "$API_URL"
