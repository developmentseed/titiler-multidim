name: Deploy

inputs:
  env_aws_secret_name:
    required: false
    type: string
    default: ''
  dir:
    required: false
    type: string
    default: "."
  script_path:
    required: false
    type: string
    default: ''
  skip_deploy:
    required: false
    type: string
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Install node and related deps
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
          cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{
          hashFiles('**/package-lock.json') }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.11.*"

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        uv sync --only-group deployment
        uv run npm ci

    - name: Get relevant environment configuration from aws secrets
      if: inputs.env_aws_secret_name != ''
      shell: bash
      working-directory: ${{ inputs.dir }}
      env:
        AWS_DEFAULT_REGION: us-west-2
        INPUTS_SCRIPT_PATH: ${{ inputs.script_path }}
        INPUTS_ENV_AWS_SECRET_NAME: ${{ inputs.env_aws_secret_name }}
      run: |
        if [[ -z "${INPUTS_SCRIPT_PATH}" ]]; then
        ./scripts/sync-env.sh "${INPUTS_ENV_AWS_SECRET_NAME}"
        else
        python "${INPUTS_SCRIPT_PATH}" --secret-id "${INPUTS_ENV_AWS_SECRET_NAME}"
        fi

    - name: CDK Synth
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: uv run npm run cdk -- synth

    - name: Check Asset Sizes
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        MAX_SIZE_BYTES=262144000  # 262 MB in bytes
        for dir in cdk.out/asset.*; do
          if [ -d "$dir" ]; then
            size=$(du -sb "$dir" | cut -f1)
            if [ "$size" -gt $MAX_SIZE_BYTES ]; then
              echo "Directory $dir exceeds 262 MB with size $size bytes (max: $MAX_SIZE_BYTES bytes)."
              exit 1
            fi
            echo "Asset directory $dir size: $size bytes"
          fi
        done
        echo "All asset directories are within size limits."

    - name: Deploy
      if: ${{ inputs.skip_deploy == 'false' }}
      id: deploy_titiler_multidim_stack
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        uv run npm run cdk -- deploy --all --require-approval never --outputs-file ${HOME}/cdk-outputs.json
