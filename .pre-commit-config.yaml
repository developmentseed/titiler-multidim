repos:
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.23
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        language_version: python3.12
        exclude: tests/.*
        additional_dependencies:
        - types-attrs
        - types-redis
        - types-requests
        - boto3-stubs
        - types-aiobotocore

  - repo: https://github.com/tsvikas/sync-with-uv
    rev: d8fd0541c438ea27c42f23f85e68684893db6fb2 # v0.5.0
    hooks:
      - id: sync-with-uv
